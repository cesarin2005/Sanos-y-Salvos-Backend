server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service-users
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: lost-pet-service
          uri: http://lost-pet-service:8082
          predicates:
            - Path=/api/lost-pets/**
        - id: found-pet-service
          uri: http://found-pet-service:8083
          predicates:
            - Path=/api/found-pets/**
        - id: matching-service
          uri: http://matching-service:8084
          predicates:
            - Path=/api/matches/**
        - id: adoption-service
          uri: http://adoption-service:8085
          predicates:
            - Path=/api/adoptions/**
        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications/**

jwt:
  secret: sanosysalvos-super-secret-key-2024-production-ready-256bits
  expiration: 86400000