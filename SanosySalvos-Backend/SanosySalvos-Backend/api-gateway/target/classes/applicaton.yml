server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: lost-pet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/lost-pets/**
          filters:
            - name: AuthFilter

        - id: found-pet-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/found-pets/**
          filters:
            - name: AuthFilter

        - id: matching-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/matches/**
          filters:
            - name: AuthFilter

        - id: adoption-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/adoptions/**
          filters:
            - name: AuthFilter

        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: AuthFilter

jwt:
  secret: sanosysalvos-super-secret-key-2024-production-ready-256bits
  expiration: 86400000